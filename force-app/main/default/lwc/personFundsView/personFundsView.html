<template>
<div class="page">

    <!-- PROFIT DISTRIBUTION MODAL -->
    <template if:true={isDistOpen}>
        <div class="modal-backdrop" onclick={closeDistribution}></div>
        <div class="modal-sheet dist-sheet">
            <div class="modal-handle"></div>
            <div class="modal-header dist-header">
                <div class="modal-title-wrap">
                    <div class="modal-title">&#128184; Profit Distribution</div>
                    <div class="modal-sub">
                        Vikram 45% · Rohan 45% · Company 10%
                    </div>
                </div>
                <button class="modal-close"
                    onclick={closeDistribution}>&#10005;</button>
            </div>
            <div class="modal-body">

                <!-- Quarter Selector -->
                <div class="form-group">
                    <label class="form-label">Quarter *</label>
                    <select class="form-input"
                        onchange={onDistQuarter}>
                        <option value="">-- Select Quarter --</option>
                        <template for:each={availableQuarters}
                            for:item="q">
                            <option key={q} value={q}>{q}</option>
                        </template>
                    </select>
                </div>

                <!-- Profit Breakdown — shown after quarter selected -->
                <template if:true={distData}>
                    <!-- Already distributed warning -->
                    <template if:true={distData.alreadyDistributed}>
                        <div class="dist-already">
                            &#9888; Profit already distributed for
                            {distData.quarter}. Details shown below.
                        </div>
                    </template>

                    <!-- Profit Summary Card -->
                    <div class="dist-summary">
                        <div class="ds-title">CALCULATED PROFIT</div>
                        <div class="ds-row">
                            <span class="ds-label">Revenue (Delivered)</span>
                            <span class="ds-val green">
                                &#8377;{distData.revenueFormatted}
                            </span>
                        </div>
                        <div class="ds-row">
                            <span class="ds-label">− Gross Margin</span>
                            <span class="ds-val green">
                                &#8377;{distData.grossMarginFormatted}
                            </span>
                        </div>
                        <div class="ds-row">
                            <span class="ds-label">
                                − Expenses
                            </span>
                            <span class="ds-val red">
                                &#8377;{distData.expensesFormatted}
                            </span>
                        </div>
                        <div class="ds-divider"></div>
                        <div class="ds-row ds-net">
                            <span class="ds-label">Net Profit</span>
                            <span class="ds-val amber">
                                &#8377;{distData.netProfitFormatted}
                            </span>
                        </div>
                    </div>

                    <!-- Adjusted Profit Input -->
                    <template if:false={distData.alreadyDistributed}>
                        <div class="form-group">
                            <label class="form-label">
                                Adjusted Profit (&#8377;) *
                            </label>
                            <input type="number" class="form-input"
                                value={distAdjusted}
                                placeholder="Enter confirmed profit"
                                onchange={onDistAdjusted}>
                            <div class="form-hint">
                                Pre-filled from calculation.
                                Change only if you want to adjust.
                            </div>
                        </div>

                        <!-- Split Preview -->
                        <div class="split-preview">
                            <div class="sp-title">DISTRIBUTION PREVIEW</div>
                            <div class="sp-row">
                                <div class="sp-person">
                                    <div class="sp-avatar sp-v">V</div>
                                    <div>
                                        <div class="sp-name">Vikram</div>
                                        <div class="sp-pct">45%</div>
                                    </div>
                                </div>
                                <div class="sp-amount">
                                    &#8377;{distVikramAmt}
                                </div>
                            </div>
                            <div class="sp-row">
                                <div class="sp-person">
                                    <div class="sp-avatar sp-r">R</div>
                                    <div>
                                        <div class="sp-name">Rohan</div>
                                        <div class="sp-pct">45%</div>
                                    </div>
                                </div>
                                <div class="sp-amount">
                                    &#8377;{distRohanAmt}
                                </div>
                            </div>
                            <div class="sp-row sp-company">
                                <div class="sp-person">
                                    <div class="sp-avatar sp-c">&#127970;</div>
                                    <div>
                                        <div class="sp-name">
                                            Company Reserve
                                        </div>
                                        <div class="sp-pct">10%</div>
                                    </div>
                                </div>
                                <div class="sp-amount">
                                    &#8377;{distCompanyAmt}
                                </div>
                            </div>
                        </div>

                        <!-- Date + Notes -->
                        <div class="form-row-2">
                            <div class="form-group">
                                <label class="form-label">
                                    Withdrawal Date *
                                </label>
                                <input type="date" class="form-input"
                                    value={distDate}
                                    onchange={onDistDate}>
                            </div>
                            <div class="form-group">
                                <label class="form-label">Notes</label>
                                <input type="text" class="form-input"
                                    placeholder="Optional note..."
                                    value={distNotes}
                                    onchange={onDistNotes}>
                            </div>
                        </div>

                        <button class="dist-confirm-btn"
                            onclick={confirmDistribution}
                            disabled={isDistSaving}>
                            <template if:false={isDistSaving}>
                                &#10003; Confirm &amp; Withdraw
                            </template>
                            <template if:true={isDistSaving}>
                                Processing...
                            </template>
                        </button>
                    </template>

                    <!-- Already distributed — read only -->
                    <template if:true={distData.alreadyDistributed}>
                        <div class="split-preview">
                            <div class="sp-title">DISTRIBUTED</div>
                            <div class="sp-row">
                                <span class="ds-label">Vikram</span>
                                <span class="ds-val">
                                    &#8377;{distData.existingVikramFmt}
                                </span>
                            </div>
                            <div class="sp-row">
                                <span class="ds-label">Rohan</span>
                                <span class="ds-val">
                                    &#8377;{distData.existingRohanFmt}
                                </span>
                            </div>
                            <div class="sp-row">
                                <span class="ds-label">
                                    Company Reserve
                                </span>
                                <span class="ds-val">
                                    &#8377;{distData.existingCompanyFmt}
                                </span>
                            </div>
                        </div>
                    </template>
                </template>

            </div>
        </div>
    </template>

    <!-- ADJUST BALANCE MODAL -->
    <template if:true={isAdjOpen}>
        <div class="modal-backdrop" onclick={closeAdjust}></div>
        <div class="modal-sheet">
            <div class="modal-handle"></div>
            <div class="modal-header adj-header">
                <div class="modal-title-wrap">
                    <div class="modal-title">&#9881; Adjust Balance</div>
                    <div class="modal-sub">
                        Add or subtract from a person's funds
                    </div>
                </div>
                <button class="modal-close"
                    onclick={closeAdjust}>&#10005;</button>
            </div>
            <div class="modal-body">

                <!-- Person selector -->
                <div class="form-group">
                    <label class="form-label">Person *</label>
                    <select class="form-input" onchange={onAdjPerson}>
                        <option value="">-- Select --</option>
                        <option value="Vikram">Vikram</option>
                        <option value="Rohan">Rohan</option>
                    </select>
                </div>

                <!-- Addition / Subtraction toggle -->
                <div class="form-group">
                    <label class="form-label">Type *</label>
                    <div class="adj-toggle">
                        <button
                            class={addBtnClass}
                            data-val="Addition"
                            onclick={onAdjType}>
                            + Addition
                        </button>
                        <button
                            class={subBtnClass}
                            data-val="Subtraction"
                            onclick={onAdjType}>
                            − Subtraction
                        </button>
                    </div>
                </div>

                <!-- Amount -->
                <div class="form-group">
                    <label class="form-label">Amount (&#8377;) *</label>
                    <input type="number" class="form-input"
                        placeholder="0.00" min="0"
                        value={adjAmount}
                        onchange={onAdjAmount}>
                </div>

                <!-- Reason -->
                <div class="form-group">
                    <label class="form-label">Reason *</label>
                    <input type="text" class="form-input"
                        placeholder="e.g. Bag return from client"
                        value={adjReason}
                        onchange={onAdjReason}>
                </div>

                <!-- Error -->
                <template if:true={adjError}>
                    <div class="form-error">{adjError}</div>
                </template>

                <button class="adj-save-btn"
                    onclick={handleAdjustSave}
                    disabled={isAdjSaving}>
                    <template if:false={isAdjSaving}>
                        &#10003; Apply Adjustment
                    </template>
                    <template if:true={isAdjSaving}>
                        Saving...
                    </template>
                </button>
            </div>
        </div>
    </template>

    <!-- LOG EXPENSE MODAL -->
    <template if:true={isExpenseOpen}>
        <div class="modal-backdrop" onclick={closeExpense}></div>
        <div class="modal-sheet">
            <div class="modal-handle"></div>
            <div class="modal-header exp-header">
                <div class="modal-title-wrap">
                    <div class="modal-title">Log Expense</div>
                    <div class="modal-sub">
                        Deducted from person's available funds
                    </div>
                </div>
                <button class="modal-close"
                    onclick={closeExpense}>&#10005;</button>
            </div>
            <div class="modal-body">
                <div class="form-row-2">
                    <div class="form-group">
                        <label class="form-label">Amount (&#8377;) *</label>
                        <input type="number" class="form-input"
                            placeholder="0.00" min="0"
                            value={expAmount}
                            onchange={onExpAmount}>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Date *</label>
                        <input type="date" class="form-input"
                            value={expDate}
                            onchange={onExpDate}>
                    </div>
                </div>
                <div class="form-row-2">
                    <div class="form-group">
                        <label class="form-label">
                            Expense Type *
                        </label>
                        <select class="form-input"
                            onchange={onExpType}>
                            <option value="">-- Select --</option>
                            <template for:each={expenseTypes}
                                for:item="t">
                                <option key={t} value={t}>
                                    {t}
                                </option>
                            </template>
                        </select>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Spent By *</label>
                        <select class="form-input"
                            onchange={onExpSpentBy}>
                            <option value="">-- Select --</option>
                            <template for:each={teamMembers}
                                for:item="m">
                                <option key={m} value={m}>
                                    {m}
                                </option>
                            </template>
                        </select>
                    </div>
                </div>
                <div class="form-group">
                    <label class="form-label">Description</label>
                    <textarea class="form-input form-textarea"
                        placeholder="What was this expense for?"
                        onchange={onExpDesc}></textarea>
                </div>
                <template if:true={expenseError}>
                    <div class="form-error">
                        &#9888; {expenseError}
                    </div>
                </template>
            </div>
            <div class="modal-footer">
                <button class="btn-cancel"
                    onclick={closeExpense}>Cancel</button>
                <button class="btn-save exp-save-btn"
                    onclick={handleExpenseSave}
                    disabled={isExpSaving}>
                    {expSaveLabel}
                </button>
            </div>
        </div>
    </template>

    <!-- EXPENSE HISTORY MODAL -->
    <!-- VIEW ALL ACTIVITY MODAL -->
    <template if:true={isActivityOpen}>
        <div class="modal-backdrop" onclick={closeActivity}></div>
        <div class="modal-sheet">
            <div class="modal-handle"></div>
            <div class="modal-header activity-header">
                <div class="modal-title-wrap">
                    <div class="modal-title">
                        {activityPerson}'s Activity
                    </div>
                    <div class="modal-sub">All transactions</div>
                </div>
                <button class="modal-close"
                    onclick={closeActivity}>&#10005;</button>
            </div>
            <div class="modal-body">
                <template if:true={isActivityLoading}>
                    <div class="loading-wrap">
                        <div class="spinner"></div>
                    </div>
                </template>
                <template if:false={isActivityLoading}>
                    <template if:true={noActivityHistory}>
                        <div class="empty-wrap">
                            <div class="empty-icon">&#128202;</div>
                            <div class="empty-title">
                                No activity yet
                            </div>
                        </div>
                    </template>
                    <template for:each={allActivityTxns}
                        for:item="txn">
                        <div key={txn.key} class="hist-card">
                            <div class="hist-left">
                                <div class="txn-row">
                                    <span class={txn.iconClass}>
                                        {txn.icon}
                                    </span>
                                    <div>
                                        <div class="hist-type">
                                            {txn.title}
                                        </div>
                                        <div class="hist-meta">
                                            {txn.meta}
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <div class="hist-right">
                                <div class={txn.amtClass}>
                                    {txn.amtDisplay}
                                </div>
                            </div>
                        </div>
                    </template>
                </template>
            </div>
        </div>
    </template>

    <!-- VIEW ALL EXPENSES MODAL -->
    <template if:true={isHistoryOpen}>
        <div class="modal-backdrop" onclick={closeHistory}></div>
        <div class="modal-sheet">
            <div class="modal-handle"></div>
            <div class="modal-header hist-header">
                <div class="modal-title-wrap">
                    <div class="modal-title">
                        {historyPerson}'s Expenses
                    </div>
                    <div class="modal-sub">Full history</div>
                </div>
                <button class="modal-close"
                    onclick={closeHistory}>&#10005;</button>
            </div>
            <div class="modal-body">
                <template if:true={isHistoryLoading}>
                    <div class="loading-wrap">
                        <div class="spinner"></div>
                    </div>
                </template>
                <template if:false={isHistoryLoading}>
                    <template if:true={noExpenseHistory}>
                        <div class="empty-wrap">
                            <div class="empty-icon">&#128179;</div>
                            <div class="empty-title">
                                No expenses yet
                            </div>
                        </div>
                    </template>
                    <template for:each={expenseHistory}
                        for:item="e">
                        <div key={e.Id} class="hist-card">
                            <div class="hist-left">
                                <div class="hist-type">
                                    {e.Expense_Type__c}
                                </div>
                                <div class="hist-meta">
                                    {e.formattedDate}
                                    <template if:true={e.Description__c}>
                                        &middot; {e.Description__c}
                                    </template>
                                </div>
                            </div>
                            <div class="hist-right">
                                <div class="hist-amt">
                                    -&#8377;{e.formattedAmt}
                                </div>
                                <template if:true={e.Is_Reimbursed__c}>
                                    <div class="reimb-badge">
                                        Reimbursed
                                    </div>
                                </template>
                            </div>
                        </div>
                    </template>
                </template>
            </div>
        </div>
    </template>

    <!-- HEADER -->
    <div class="pf-header">
        <div class="pf-title">Person Funds</div>
        <div class="pf-subtitle">Cash position per team member</div>
    </div>

    <!-- LOADING -->
    <template if:true={isLoading}>
        <div class="loading-wrap" style="padding:60px 20px;">
            <div class="spinner"></div>
            <div class="loading-text">Loading funds...</div>
        </div>
    </template>

    <template if:false={isLoading}>

        <!-- TEAM TOTAL CARD -->
        <div class="team-card">
            <div class="tc-label">Total Available — Team</div>
            <div class="tc-amount">&#8377;{teamAvailable}</div>
            <div class="tc-formula">
                <div class="tcf-item">
                    <div class="tcf-val green">
                        &#8377;{teamCollected}
                    </div>
                    <div class="tcf-label">Collected</div>
                </div>
                <div class="tcf-sep">−</div>
                <div class="tcf-item">
                    <div class="tcf-val red">
                        &#8377;{teamMfrPaid}
                    </div>
                    <div class="tcf-label">Paid Mfr</div>
                </div>
                <div class="tcf-sep">−</div>
                <div class="tcf-item">
                    <div class="tcf-val red">
                        &#8377;{teamExpenses}
                    </div>
                    <div class="tcf-label">Expenses</div>
                </div>
                <div class="tcf-sep">=</div>
                <div class="tcf-item">
                    <div class="tcf-val amber">
                        &#8377;{teamAvailable}
                    </div>
                    <div class="tcf-label">Available</div>
                </div>
            </div>
            <div class="tc-updated">
                Updated {teamLastUpdated}
            </div>
        </div>

        <!-- LOG EXPENSE BUTTON -->
        <div class="log-wrap">
            <button class="log-btn" onclick={openExpense}>
                <span class="log-icon">+</span>
                <span class="log-text">Log Expense</span>
                <span class="log-arrow">&#8594;</span>
            </button>
        </div>

        <!-- ADJUST BALANCE BUTTON -->
        <div class="log-wrap">
            <button class="adj-btn" onclick={openAdjust}>
                <span class="log-icon">&#9881;</span>
                <span class="log-text">Adjust Balance</span>
                <span class="log-arrow">&#8594;</span>
            </button>
        </div>

        <!-- PROFIT DISTRIBUTION BUTTON -->
        <div class="log-wrap">
            <button class="dist-btn" onclick={openDistribution}>
                <span class="log-icon">&#128184;</span>
                <span class="log-text">Profit Distribution</span>
                <span class="log-arrow">&#8594;</span>
            </button>
        </div>

        <!-- WITHDRAWAL HISTORY -->
        <template if:true={hasWithdrawals}>
            <div class="section-label">PROFIT WITHDRAWALS</div>
            <template for:each={withdrawalHistory}
                for:item="w">
                <div key={w.Id} class="withdrawal-card">
                    <div class="wc-left">
                        <div class="wc-quarter">{w.Quarter__c}</div>
                        <div class="wc-date">{w.formattedDate}</div>
                    </div>
                    <div class="wc-right">
                        <div class="wc-total">
                            &#8377;{w.formattedTotal}
                        </div>
                        <div class="wc-split">
                            V: &#8377;{w.formattedVikram} &nbsp;|&nbsp;
                            R: &#8377;{w.formattedRohan} &nbsp;|&nbsp;
                            Co: &#8377;{w.formattedCompany}
                        </div>
                    </div>
                </div>
            </template>
        </template>

        <!-- PERSON CARDS -->
        <div class="people-section-label">By Team Member</div>

        <template if:true={noPeople}>
            <div class="empty-wrap">
                <div class="empty-icon">&#128101;</div>
                <div class="empty-title">
                    No Person Fund records found
                </div>
                <div class="empty-sub">
                    Create a Person_Fund__c record for each
                    team member in Salesforce
                </div>
            </div>
        </template>

        <template for:each={personFunds} for:item="pf">
            <div key={pf.Id} class="person-card">

                <!-- Top row -->
                <div class="pc-top">
                    <div class="pc-avatar">{pf.initial}</div>
                    <div class="pc-info">
                        <div class="pc-name">{pf.Name}</div>
                        <div class="pc-date">
                            Updated {pf.formattedDate}
                        </div>
                    </div>
                    <div class="pc-avail">
                        <div class="pc-avail-label">Available</div>
                        <div class={pf.availClass}>
                            &#8377;{pf.formattedAvail}
                        </div>
                    </div>
                </div>

                <!-- Metrics -->
                <div class="pc-metrics">
                    <div class="pcm">
                        <div class="pcm-val green">
                            &#8377;{pf.formattedCollected}
                        </div>
                        <div class="pcm-label">Collected</div>
                    </div>
                    <div class="pcm">
                        <div class="pcm-val red">
                            &#8377;{pf.formattedMfrPaid}
                        </div>
                        <div class="pcm-label">Paid Mfr</div>
                    </div>
                    <div class="pcm">
                        <div class="pcm-val red">
                            &#8377;{pf.formattedExpenses}
                        </div>
                        <div class="pcm-label">Expenses</div>
                    </div>
                </div>

                <!-- Recent transactions -->
                <template if:true={pf.hasTransactions}>
                    <div class="pc-txns">
                        <div class="pc-txns-label">
                            Recent Activity
                        </div>
                        <template for:each={pf.transactions}
                            for:item="t">
                            <div key={t.key} class="txn-row">
                                <div class={t.iconClass}>
                                    {t.icon}
                                </div>
                                <div class="txn-info">
                                    <div class="txn-title">
                                        {t.title}
                                    </div>
                                    <div class="txn-meta">
                                        {t.meta}
                                    </div>
                                </div>
                                <div class={t.amtClass}>
                                    {t.amtDisplay}
                                </div>
                            </div>
                        </template>
                    </div>
                </template>

                <!-- Footer -->
                <div class="pc-footer">
                    <button class="view-exp-btn"
                        data-person={pf.Name}
                        onclick={openHistory}>
                        &#128179; View All Expenses
                    </button>
                    <button class="view-activity-btn"
                        data-person={pf.Name}
                        onclick={openActivity}>
                        &#128202; View All Activity
                    </button>
                </div>

            </div>
        </template>

    </template>

    <div class="bottom-space"></div>
</div>
</template>
